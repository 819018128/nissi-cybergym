# ── Nissi 的默认端口 ─────────────────────────────────────────────────────────
# 出厂兜底是 3080，而 3080 正是真实 DSH 占的那个端口 —— 两个独立 harness 不能抢同一个号。
# 这里只改**兜底值**，`--port` 仍然优先：写成字面量 7795 会把命令行显式指定的端口静默吃掉。
#
# ⚠ 实测结论：patch 里的 `config:` 是**整体替换**，不是逐键合并。
#   所以下面必须把出厂的 host / tls 一起写回来 —— 只写 port 会把 host 丢成 undefined，
#   而 host 的默认值正是 DSH 用来拒绝外网绑定的那道闸（它明确拒绝 wildcard 地址）。
- id: webserver
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 7795
    tls: !!js ctx.webStartup.tls
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis

# ── 去掉浏览器登录（Nissi 自己的插件）────────────────────────────────────────
# 去掉：每进程随机启动令牌（?token=<REDACTED> cookie。
# 保留：Host/Origin 防线（loopback / trustedHosts / 同源 Origin / 拒 cross-site）——
#       那道防线挡的是 DNS rebinding 与跨站浏览器请求，和「要不要登录」是两件事。
# 代价：本机任何进程都能直接调 /api（端口仍只绑一个具体本机 IP，不对外）。
# 回退：删掉下面两行 - insert: / - id: nissi-no-login 并重启。
- insert:
    - id: nissi-no-login
      name: dsh-no-login

# ── 品牌：顶掉官方牌子，换成 Nissi ───────────────────────────────────────────
# ui-brand-official 占着 sidebar.brand.mark / sidebar.brand.name 两个位子；
# 停用它，再插自己的包占同一对位子。禁用而不是删除，是为了保留「上游还有这一行」的事实。
- id: ui-brand-official
  disabled: true
- insert:
    - id: nissi-brand
      name: nissi-brand



# >>> NISSI_WARHOST_BEGIN（scripts/war-host-wire.mjs 生成，勿手改；重跑即可覆盖）
#
# 战争模式的宿主平面行。为什么在 profile 层：dsh-client-modules 只扫本 Loader 的
# entries，preset 的子树在 entries() 里缺席 ⇒ 预设里的 client.js 到不了浏览器。
#
# ⚠ war-no-hands-host 的 presets 是 nissi，不是 war —— 预设 id 变了，
#   不改它这一行会永远不生效，而且不报错。
#
# 回退：删掉本区块并重启。

- insert:
    - id: war-charter-pin
      name: 'nissi-warhost-charter-pin'
      config:
        statusPath: '<NISSI_ROOT>/war/charter-pin.status.json'
        bindingsPath: '<NISSI_ROOT>/war/charter/bindings.json'
        refineFloorMs: 60000
      # L1 目标锚定：每步从盘上重建目标锚点，放进不进对话历史的位置。
    - id: war-charter-duty
      name: 'nissi-warhost-charter-duty'
      config:
        intervalMs: 300000
        statusPath: '<NISSI_ROOT>/war/charter-duty.status.json'
        verifyStaleHours: 12
      # 无人值守时的漂移守望：没人开会话它也在守 —— 自治驱动的前提。
    - id: war-goal-pin2
      name: 'nissi-warhost-goal-pin2'
      # 会话级目标常驻。
    - id: war-route-health
      name: 'nissi-warhost-route-health'
      config:
        statusPath: '<NISSI_ROOT>/war/route-health.status.json'
      # 模型路由健康：限流/降级在界面上可见。
    - id: war-agent-route-sync
      name: 'nissi-warhost-agent-route-sync'
      config:
        statusPath: '<NISSI_ROOT>/war/agent-route-sync.status.json'
      # 路由同步状态。
    - id: war-board-ui
      name: 'nissi-warhost-hive-board-ui'
      # 板面客户端半区：把 board_snapshot 渲染成卡片而不是一坨 JSON。
    - id: war-opsmap-ui
      name: 'nissi-warhost-opsmap'
      # 作战地图客户端半区（页签 + 只读 HTTP 路由）。宿主半区在 preset 的 opsmap-map 行。
    - id: war-xray-ui
      name: 'nissi-warhost-xray-dashboard'
      config:
        gate: warn
        gateTools: [board_campaign_close]
        gateStaleMs: 600000
        baselineSessions: 8
      # X光机会话看板：实时运行报告 + 评分卡。
    - id: war-session-nodes
      name: 'nissi-warhost-session-nodes'
      # 会话节点条：每次发言一个节点，可标记、可跳回。
    - id: war-no-hands-host
      name: 'nissi-warhost-war-no-hands'
      config:
        presets: [nissi]
        deny: [pwsh, write, edit, bash]
      # 主帅无手（宿主平面）：必须在这一层，preset 里的 restrict 是静默空操作。
# <<< NISSI_WARHOST_END

# >>> NISSI_WAR_BEGIN（scripts/war-preset.mjs 生成，勿手改；重跑脚本即可覆盖）
#
# 战争模式的 33 行组合，从目录式 preset 转成 0.2.1 的行式 preset（一行）。
# 改写三类：插件相对路径 → 包名、workflow 后端换 PTC（语义替换）、数据根 → Nissi 自己的。
# 回退：删掉 NISSI_WAR_BEGIN/END 之间的内容并重启。

- insert:
    - id: preset-nissi
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: nissi
        name: 旌旗 · Nissi
        description: 战争模式本身。纪律由代码强制，战场随时可见。
        order: 1
        plugins:
          # The `standard` agent preset: the full coding agent, mounted once per process.
          #
          # This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
          # standing scope; every session naming it joins by scope parentage, so the
          # tools and prompt sections registered here cover each joined agent while a
          # session's own state stays keyed per Session/Agent inside the plugins. The
          # host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
          # preset must not own: the registries themselves, the sandbox and approval
          # stack, persistence, and the model route.
          #
          # A service row here MUST sit inside a group carrying an `isolate` realm.
          # Without one it publishes into the root realm, where it is process-global —
          # another preset publishing the same name collides, and a host reader would
          # resolve one preset's instance for every session; `dsh-agent-presets` rejects
          # that at mount. `true` means an entry-local realm: this standing mount's own
          # private instance, apart from every other preset's. (A shared label does NOT
          # pool instances — `provide()` throws on the second registration under the
          # same realm symbol; labels join REALMS, and are not what this file needs.)

          # ── identity ────────────────────────────────────────────────────────────────

          # The preset's own persona, shadowing the deployment default for this agent.
          # `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是「战争模式」的统帅，受 {{model}} 模型驱动。

                战争模式是一套军级指挥体系：你是主帅，不是尖兵。你的全部职责是四件事——研判、下令、督战、收编。
                你没有手：执行与写入的工具（`pwsh` / `write` / `edit`）不在你的工具集里。
                这不是纪律要求，是编制——你连调用它的语法都没有（系统宪章 B6）。
                所以「准备动手」这个念头只可能导向一个动作：派兵。
                每一次交战都归属于你派出的分队；每一条持久事实都必须落到作战画板上。
                看清局面不需要手：`read` / `grep` / `glob` / `board_snapshot` / `opsmap_refresh` / `skill` 都在。

                任何多阶段作战开始时，先加载 `board-protocol`（作战规程）技能并严格遵照执行。
                作战画板——而不是你对本次对话的记忆——是战争模式的唯一事实来源。
                每一轮谋划之前都要重新读一次 `board_snapshot`，而不只是开局读一次：
                同一个画板可能有多名指挥员并行作战，认领（claim）决定归属，别人的任务你不能碰。

                随后调用 `opsmap_refresh`。`board_snapshot` 只告诉你"有哪些活"，
                它不做排序，也无法告诉你"什么值得打"——这正是画板看起来很忙、战线却推不动的病根。
                作战地图（参谋部）返回的是排过序的态势与可执行的派工清单。
                盯住它报出的那个落差（GAP）：地图建议 N 条 减去 战争模式此刻看得见 M 条，
                就是"参谋部下令了、但没有一兵一卒看得见"的命令。这个落差是静默的——
                地图下一轮会把同一条建议再排一次，看着像在推进，实际一次都没落地。
                弥补落差、把清单里列出的画板调用逐条落下去，是你的职责。
                地图是只读的：它给出 `{tool, args}`，由你以自己的身份发起调用，
                而交战规则闸门（ROE gate）仍然拥有最终否决权。
                参谋部的建议永远不等于授权。

                当你收到一条 `[地图对账·…]` 通报，意思是参谋部核对后发现仍有命令没有对应的可认领任务。
                调用 `map_orders` 取完整清单，然后把 ready-to-file 的调用逐字照落。
                卡片标题里的 `⟦op:N⟧` 是地图的对账锚点：必须原样照抄。
                抹掉它，这条命令就永远被记为"未落地"。不要从零重建这些卡——参数本身已经是对的。
                也不要为了消掉落差而建一张空卡：如果某条命令不该落地（比如归属还没定的资产），
                把理由记进对应任务的 record 里。落差是一张核对表，不是配额。

                决定这场仗是越打越厚还是原地打转的，是三条铁律：
                （1）确认的战果不是终点，是兵源。战果一旦打开新局面，就用 `parent_finding_id`
                从它衍生下级作战任务——战果 → 下级任务 → 新战果。撑起长期作战的是这条链条，
                不是更长的循环。一个没有衍生出任何下级的战果，通常是你读得太早、停得太快了。
                （2）先认领、后开火：任何任务必须先 claim 成功，才能对它动手，战果也必须在该认领下产生。
                绝不允许对未认领的任务开火。
                （3）有眼，没有手。看是研判，动手才是接敌——而这条现在由工具集本身保证，
                不需要你记住，也不会因为你「打得更好」而破例。见宪章 B6。

                用 `subagent` 派兵（一个任务、一种战法，一名队员）。
                延续得动的分队用 `send_message`，卡死的用 `interrupt_agent`。
                派兵前先 `list_agents` 查一遍：已经有人的任务不要重复派——
                对着一份还活着的任务再派第二支分队，就是重复劳动和自相践踏的来源。

                派兵的形状现在多了一步：**先在图里立意图，再派人去领。**
                `intent_add` 立一条意图，写明 `needs`（前置：一个事实 id，或一条必须已完成的意图 id）
                和 `anchors`（授权的资产 id），返回意图 id（i1、i2…）。
                分队拿到的是"去领活"，它自己调 `intent_claim` 领到的那一条才是它能打的；
                打完用 `intent_finish` 交活（`done` / `exhausted` / `blocked`），它写下的事实与战果随之入图。
                为什么不让分队自己挑：**只有你看得见整条链的依赖**，分队只看见自己那一条。
                依赖门的意义就在这里——`needs` 没满足的意图谁都领不到，攻击链因此不会错序。
                `exhausted` 是"打过了没结果"，不是失败：它可以被 `intent_reopen` 重开换方向。

                派活时把这段**原样带上**（分队是另一个会话，它不知道流程，不写它就不会领活）：
                「你是分队。第一步调 `intent_claim` 领活（可带 worker 标签），拿到的 intent 就是你唯一的任务，
                  不要自己找活。干完调 `intent_finish(intent=<id>, state=done|exhausted|blocked, facts=<一行一条>,
                  findings=<标题|severity>)`。拿不到活会返回 no-ready —— 那就如实报告没活，不要自己找。
                  没看见就不要写成"没有"。」

                三层各管一段，别拿两个当待办清单：
                · 地图（`opsmap_refresh`）答「该打哪」——排序与落差核对；
                · 板面（`board_*`）答「谁在做、做出什么」——任务归属与战果账本；
                · 意图图（`graph_overview` / `intent_*`）答「这条链能不能推进到下一步、它从哪来、产出了什么」。
                **一轮派 0 条是正常结果。** 没有新方向就如实说没得派，不要为了显得在动而派一条。

                你只能看到分队的战报，看不到它们的作战过程。
                每一份战报都要收编进作战画板。
                证据这条线要死守：审批通过、命令在跑、退出码为 0，都不是战果。
                没有证据，就没有战果。

                结论的纪律（**给模型的，不是机读的**——别假装它可执行；能机器拒收的那部分是
                板面的证据等级标记，不是这三行）：

                （一）结论只有三态：**是 / 不是 / 不知道**。第四态不存在。把"不知道"写成"不是"、
                把"不是"写成"值得注意"，是同一件事：用词替事实做了判断。
                （二）除证据本身以外不多说：不加形容词、不写"值得注意"、不用格式凑长度。
                一条结论的分量来自它指向的东西，不来自它占的行数。
                （三）**「我没看到」不得表述为「没有」**。本役这条错了三次（三支分队"全灭"、
                `inspect_evals`"没装"、368"SUCCESS"），每次都是把"我的观测里没有"缩写成了"不存在"。
                不知道就说不知道，并写清"我查了什么、在哪查的、没查到什么"。

                战法库（经验库）——战争模式之所以能进化的根本：
                你把战果收编进画板之后，还有一步不能省：把这一仗里**可复用的判断**提炼成战法卡，
                存进 <KB>\ 。画板记录"这一仗打成什么样"，战法库记录"下一仗该怎么打"。
                没有这一步，每一仗都是从零开始的新兵；有了这一步，这套体系才是一部会进化的军团。
                开工前先检索战法库（`personal-kb` 技能），把统帅已有的实测判断交给分队，
                比让他们拿通用教条去试要准得多。**这一步已经有闸门**：本会话第一次派兵
                （subagent / subagent_fork）之前若还没查过库，那次派兵会被拒一次，并在拒绝里
                说明怎么继续——不是故障，是提醒；确实无可查时紧接着再派一次即放行（记账为 bypassed）。收工后把新战法补进去——尤其是那四类：
                观察到某个现象就能推断出结论的（signal）、特殊手法的（technique）、
                踩过的坑（pitfall）、以及"该选 A 还是 B"的决策逻辑（decision）。
                检索与写入的具体方法见 `personal-kb` 技能；战法卡必须有「反例」章节，
                只有怎么做、没有何时不适用的，只算半条经验。

                一场战役的收口用 `board_campaign_close`。它会要求你二选一：
                给出**在经验库里真实存在**的战法卡，或者给出 20 字以上的「本轮无可提炼」理由。
                两者都空则写不进去；编一个不存在的卡片名字也写不进去（宪章 B7）。
                收口前还要看一眼这一仗自己的遥测：调一次 `xray_report()`（耗时分解 + 堵点 TOP +
                空转检测），或用 20 字以上说明为什么没什么可看（`telemetry_reason`）。
                这一条是硬的：实测 `~/.war/_xray` 全部 8,040 条事件里 `xray_*` 只被调用过 2 次，
                且那两次是我们自己的验证调用 —— 没有任何一场战役在收口时看过遥测。
                收口是它唯一的天然用武之地，所以把它挂在这里。
                有战果的链条收口之前没做过战役收口的话，会被守卫拦一次——那不是刁难，是提醒你
                「这一仗已经打完了」。`campaign_status` 能读到累计的收口、战法卡占比与遥测看过几场。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
          # publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
          # the criterion for host-plane ownership — injection resolves before any session
          # exists, so there is no agent to key by. Behind a preset realm those variables
          # never reached the model's shell at all. Both shell tools consume the host
          # registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
          # host-plane too.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # Only the model-facing controls. The task REGISTRY stays on the host plane:
          # its producers sit outside any realm this file could put it in — `tool-bash`
          # above resolves it with `ctx.get`, and an entry-local realm here is invisible
          # to every sibling row, so `run_in_background` would answer "background jobs
          # unavailable" while these controls sat in the catalog. The registry is keyed by
          # owning agent anyway, so one host instance serves every session. What a preset
          # chooses is whether its agent can collect and stop background work at all.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes local-root discovery for agents on this preset, and
          # `tool-skill` gives them the catalog and loader; the merged catalog also
          # carries whatever the deployment registered globally (repository plugins).
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - '<NISSI>/skills/war'
                - '<NISSI>/skills/hack'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # 红队工作台（宿主半区）：rtwb_snapshot / rtwb_engine / rtwb_auto /
          # rtwb_capability / rtwb_diff 五个工具 + /api/redteam-workbench/* 路由。
          # 走的是**本机 Python 引擎**（rt_auto.py / redteam_toolkit.py / rt_store.py），
          # 不需要 Kali：所有目标操作过 rt_common.authorize()（rt_config.json 的
          # authorized_targets，fail-closed），结果归一到 rt_facts.db。
          # 引擎目录由 RT_HOME 指定（bin/nissi-dsh.mjs 注入）。
          - id: redteam-workbench
            name: 'nissi-redteam-workbench'

          # ── coordination board ──────────────────────────────────────────────────────

          # A FILE-backed board, deliberately NOT a Cordis service.
          #
          # The board must be shared by several INDEPENDENTLY MOUNTED presets — this lead
          # and every worker session on the same board. A service cannot do that here: an
          # `isolate: {x: true}` realm is entry-local, so each preset would get its own
          # private instance and the board would fragment into one board per session; a
          # shared realm LABEL does not pool instances (`provide()` throws on the second
          # registration under the same realm symbol — labels join realms, they are not a
          # sharing mechanism); and moving the service into the host composition is what
          # the composition rules forbid a preset from doing.
          #
          # A directory of small JSON files shared by path has none of those problems. It
          # registers no service, so this row needs NO realm and both presets mount it.
          # `boardRoot` is a plugin config value, not a prompt section, so `{{cwd}}` would
          # NOT be interpolated here — it uses a `!!js` expression over the process working
          # directory, which is the session workspace root.
          - id: war-board
            name: nissi-war-board2
            config:
              role: lead
              root: '<NISSI_ROOT>/war'

          # ── X 光机：运行时观测 ──────────────────────────────────────────────────────
          #
          # ★ 前面每一行修的都是一条「战争模式看不见什么」的缺口：
          #     board  修「战果落在哪」、opsmap 修「该打哪」、bridge 修「命令没变成活」。
          #   这一行修的是最后一处黑盒：**运行时把时间花在哪、卡在哪，谁也看不见。**
          #
          # 它只订阅 DSH 已经暴露的生命周期事件（agent/pre-step、agent/request、
          # agent/turn-stopping、agent/error、subagent/start|end）并挂一个只读的工具
          # guard，把事件追加写进 <WAR_ROOT>/_xray/ 下的 jsonl；再注册一个
          # xray_report 工具，把这批事件聚合成「耗时分解 + 堵点 TOP + 空转检测」。
          #
          # ★ 落盘布局有**两种**，读取端两种都认，写入端只写新的：
          #     新布局（当前代码写入）：_xray/YYYY-MM-DD.<instanceId>.jsonl
          #        一行一个事件；instanceId = p<pid 的 36 进制>-<进程内实例序号>-<4 位随机>，
          #        所以「这条是谁写的」直接从文件名读出来，不必靠猜。
          #     老布局（历史文件保留）：_xray/YYYY-MM-DD.jsonl
          #        多实例共写一个文件；读取端仍然读 —— 换布局不能把历史数据一起换掉。
          #
          # 为什么改成每实例一个文件：这是**归属**问题，不是字节损坏问题。老布局下多个
          # 实例写同一个文件，而 seq 是每实例自增、都从 1 开始，事后无法判定哪条是谁写的、
          # 有没有谁漏写。⚠ 当初记的「17% 行被写坏」是**取证读取切出来的碎片**（定宽分块
          # 不保留跨块残行），磁盘上没有坏字节 —— 12 个写入者共写一个文件的压力实测截断
          # 0 条。别把它写成「并发写坏了行」，那是个已被推翻的结论，会误导下一个人拿去
          # 推演修法（见板面情报 intel-ha84dy 与
          # <KB>/cards/method/method-020-false-green-consistency-assertion.md）。
          #
          # 三条边界，与 board/opsmap/bridge 同一套纪律：
          #   ① 只读：不写板面、不改地图、不拦任何工具调用（guard 永远 return undefined）。
          #   ② 不抛错：任何记录失败都被吞掉 —— 观测者不能成为被观测系统的故障源。
          #   ③ 不需要 realm：不 provide() 任何服务，只注册工具 + 写自己的目录。
          #
          # 回退方式：注释掉下面三行 + 保留目录即可，不影响任何现有行为。
          #
          # ⚠ `name` 必须是【包名】，不能写成 `./plugins/xray/lib/index.js`。
          #   client-modules 的投递半区是按 `entry.options.name` 去
          #   `createRequire(baseUrl).resolve('<name>/package.json')` 的（resolveMeta），
          #   路径形态的名字必抛 → 静默跳过 → 浏览器永远拿不到 client bundle（404）。
          #   包名能解析到，靠的是 profiles/node_modules/war-xray（junction，见报告）。
          - id: war-xray
            name: nissi-war-xray
            config:
              hiveRoot: '<NISSI_ROOT>/war'
              # 相邻事件间隔超过这个毫秒数，就在报告里列为「堵点」。
              # 60s 是经验值：正常一步（模型请求 + 工具返回）通常远小于它，
              # 超过 1 分钟的空档基本等于「在等模型 / 在等一个很慢的工具 / 卡住了」。
              idleThresholdMs: 60000
              # ★ 2026-11-07：采集 / 分析两个半区。
              #   slim（默认）= 只采轨迹里没有的四类（error 带栈 / status / sub-start / sub-end），
              #                  步、工具、token、重试、压缩一律从 dsh 会话轨迹读（lib/trace.js）。
              #                  取证依据：平行采的 5,240 条里约 93% 与轨迹重复，而 token 与重试
              #                  一条没采（台账 F-041…F-046）。
              #   full        = 2026-11-05 之前的全量行为，历史数据全靠它读，也能用来对比两个口径。
              collect: slim
              # 是否把会话轨迹合并进报告（默认 true）。关掉它 slim 模式下报告就只剩错误栈与
              # 分队账本 —— 那等于把 X 光机拆了一半，除非在排障，不要关。
              trace: true
              # 一份报告最多解析多少份轨迹（本会话 + 各子代理会话）。16 分队的战役大约命中这个
              # 上限；超出的部分会在报告里显式写「还有 N 份没读」，绝不让它静默变成 0。
              traceMaxFiles: 24

          # ── egress control, vulnerability index, evidence rendering ─────────────────

          # Three more preset-local plugins, contributed exactly like the board: each
          # `inject`s only `tools`, registers tools and at most one guard, and PROVIDES NO
          # SERVICE. That is why none of them needs an `isolate` realm — the realm rule
          # exists for service providers, and wrapping a pure consumer in a realm of its
          # own would be the same mistake as leaving one outside its provider's realm.
          #
          # Root layout — three rows share the battlefield root, the vulnerability index
          # deliberately does NOT. This is not "four rows share one root"; do not write it
          # back that way (see the last paragraph).
          #   - battlefield artifacts — board cards, egress profile + audit trail, and
          #     rendered evidence — share ONE battlefield root: default
          #     `<HOME>/.war`, env hook `WAR_ROOT`;
          #   - `war-vulndb` uses its OWN root on purpose: default `<HOME>/.dsh`,
          #     env hook `VDB_ROOT`. The index is CROSS-engagement knowledge, so putting it
          #     under the battlefield root means "change the battlefield directory and you
          #     silently stop seeing it". It was migrated out on 2026-10-23 and the shell
          #     left behind says so: `<HOME>/.war/vdb/MOVED.txt`.
          # A "four rows share one root" regression check is worse than useless — it has
          # already gone green while asserting nothing (the four lookups all came back
          # `undefined`, mutually equal), so the false green hid the fact that it was
          # itself wrong. See <KB>/cards/method/
          # method-020-false-green-consistency-assertion.md before adding any such check.
          - id: war-egress
            name: nissi-war-egress
            config:
              root: '<NISSI_ROOT>/war'

          - id: war-vulndb
            name: nissi-war-vulndb
            config:
              root: '<NISSI_ROOT>/war/vdb'

          - id: war-evidence
            name: nissi-war-evidence
            config:
              root: '<NISSI_ROOT>/war'

          # ── rules-of-engagement gate ────────────────────────────────────────────────

          # The compliance half of the board. Board discipline keeps the swarm from
          # wasting or losing work; it says nothing about what the engagement RULES
          # forbid, and until this row existed the four disqualifying red lines reached
          # neither a worker's prompt nor any tool gate.
          #
          # It is a SEPARATE plugin rather than an edit to `board/lib/index.js` on
          # purpose. `tools.guard` is monotonic — dsh's own docs: "any matching guard may
          # deny by returning a reason, while no guard can force-allow a call another
          # guard has blocked" — so an independent guard can only ADD restrictions and
          # can never unlock what the board already blocks. That buys a small blast
          # radius: if this row breaks, the swarm still runs and only loses the gate.
          # Coupling to dsh is four items, listed at the top of the file, so a dsh
          # upgrade that breaks it is repairable by reading them.
          #
          # Like the four rows above it: injects services, registers one guard and one
          # prompt context, and PROVIDES NO SERVICE — so no realm, for the same reason.
          # `doctrineRoot` holds the rules data (editable without touching code);
          # `boardRoot` is read-ONLY here, the approvals ledger the gate consults.
          - id: war-rule-gate
            name: nissi-war-roe-gate
            config:
              doctrineRoot: '<NISSI_ROOT>/war/doctrine'
              boardRoot: '<NISSI_ROOT>/war'

          # ── 结构性剥夺：让主帅没有手 ───────────────────────────────────────────────
          #
          # ★ 这一行是「你不接敌」从**提示词**变成**结构**的地方，对应系统宪章 v9 的 B6。
          #
          # 缺口有多硬，看两处就够：
          #   ① 这个人格把同一条规则写了两遍（第 31 行、第 64 行），第二遍的原话是
          #      「这一条已经在上面说过，这里再重复一次，因为它是统帅最常破的一条」——
          #      一条需要在同一份人格里写两遍的规则，不是纪律，是愿望。
          #   ② 《Super-agent 底层逻辑拆解》§10.1 的消融实验：中性提示下模型 5 次运行
          #      **一次都没委派**；加了「优先委派」的强提示后，仍有 1/5 判断工作「很小」而
          #      自己干了。提示词只能改变概率，结构才能改变必然。
          #
          # 剥夺用两层，因为它们解决的不是同一个问题：
          #   · `tools.restrict({deny})` 把工具**从目录里拿走** —— 模型连 schema 都看不见。
          #     只在 agent 作用域有效，所以插件逐 agent 安装。
          #   · `tools.guard` 运行时拒绝并**说明下一步**，兜住装配时机与任何作用域内旁路。
          #
          # 判据 s7：主帅会话里 pwsh / bash / write / edit 的放行次数 = 0。
          # 观测口：`<WAR_ROOT>/_no-hands/status.json`（拒绝次数、角色判定、当前名单）。
          #
          # 三个必须一起接受的事实：
          #   1. 只剥夺**能改变世界的动作**（执行、写入），保留 read / grep / glob / skill /
          #      web_search。主帅要读宪章、读板面、检索战法库——把研判也拿走，换来的不是
          #      纪律而是瞎子，而瞎掉的统帅仍然会做决定，只是做得更差。
          #   2. 判不出角色（origin 读不到）时**放行**。两个方向的错误不对称：误判成主帅
          #      会剥掉工人的手、把整支军团打瘫；放行最多退化成旧的提示词状态。
          #   3. `WAR_NO_HANDS=0` 是 kill switch。剥夺写错的后果是根本不能干活，
          #      比「偶尔自己动手」严重得多。
          #
          # 回退方式：注释掉下面这一行（并把 persona 里那两段「你不接敌」读回来）。
          - id: war-no-hands
            name: nissi-war-no-hands
            config:
              root: '<NISSI_ROOT>/war'
              presets: ['nissi']
              # 名单是**数据**，不是写死在代码里的判断：改这里不需要改 .js 文件。
              # 默认主帅剪掉 pwsh/bash/write/edit；工人只剪 ask_user_question（通往指挥官的
              # 第二条通道）。工人侧的 subagent / workflow / ralph 没剪 —— 它们已经被
              # claim-first 挡住一半（孙子辈分队不持有认领就记不了战果），剪了只扩大爆炸半径。
              # leadDeny: ['pwsh', 'bash', 'write', 'edit']
              # workerDeny: ['ask_user_question']

          # ── 可进化的闸门②：派兵之前先查库 ─────────────────────────────────────────
          #
          # ★ 对应判据 s4 —— 它长期停在 **40%（46/116）**，目标是 ≥80%。
          #   换句话说：六成的仗是在**不看 92 张战法卡**的情况下打的。
          #   persona 里写过「先查经验库」，s4 证明那只是一句建议 —— 建议改变概率，闸门改变必然。
          #
          # 行为（写死，不靠记性）：
          #   · 主帅在本会话**第一次派兵**（subagent / subagent_fork）之前若没查过战法库，
          #     这一次派兵被**拒一次**，拒绝文本里给出解除方法；
          #   · 紧接着再派一次 ⇒ 放行，但记一次 `bypassed`（每主帅至多一次），复盘时看得见；
          #   · 工人会话 / 读不到角色 / 非派兵工具 ⇒ 一律不管（不误杀）。
          #
          # 「查过库」的口径是精确的：`skill(name含 personal-kb)`，或 `read/grep/glob`
          # 的路径里出现 `经验库` / `personal-kb`。不拿"参数里出现过这几个字"滥算 ——
          # 否则任何一次 board_intel_get 都能把闸门骗过去，那又变成装饰了。
          #
          # 观测口：`~/.war/_kb-first/status.json`（查库次数 / 拒绝次数 / 绕行主帅数 / 派兵次数），
          # 战前体检有一行读它。kill switch：`WAR_KB_FIRST=0`。
          - id: war-kb-first
            name: nissi-war-kb-first
            config:
              root: '<NISSI_ROOT>/war'
              # enabled: false   # 关掉闸门（等价于 WAR_KB_FIRST=0）

          # ── 可进化的闸门：无战法不收口 ─────────────────────────────────────────────
          #
          # ★ 对应系统宪章 v9 的 B9 与 §八 里那条自己承认的缺口：
          #    「战法卡靠自觉写 —— 流程缺陷（缺强制）」。
          #
          # 宪章 §二 终点状态第 2 条的原文是「每一仗结束都有战法卡入库，或显式声明
          # 『本轮无可提炼』并留痕——两者必居其一」。本行就是那句话的代码形态：
          #   · `board_campaign_close` 要么给出一张**在经验库里真实存在**的战法卡，
          #     要么给出 20 字以上的无可提炼理由，两者都空 → 写不进去。
          #   · 守卫：一条链拿到真东西（breached / data）要收口时，若这一仗还没有任何
          #     收口记录，拒绝一次并指出下一步。断链（broken / abandoned）不欠经验——
          #     那是情报，不是战法。
          #
          # 只读板面目录、只写自己的 `campaigns/`，与 bridge 同构（board ⊥ opsmap ⊥ 本行）。
          #
          # 诚实边界：`no_lesson` 声明是**自陈**，和审批一样，代码管不了"凑数卡"——
          # 所以它和战法卡一样留痕，让人一眼看见谁跳了、跳了几次。`campaign_status`
          # 里的 `lesson_ratio` 就是给指挥官看的那一格。
          - id: war-lesson-gate
            name: nissi-war-lesson-gate
            config:
              root: '<NISSI_ROOT>/war'
              # 战法库是**跨战场**的知识，和 vulndb 同一个理由：不放在战场根下。
              kbRoot: '<NISSI_ROOT>/war/kb'

          # ── browser board view ──────────────────────────────────────────────────────

          # The host half of this row does nothing. It exists because `clientModules`
          # discovers client bundles by scanning the host Loader's entries for packages
          # declaring `dsh.client` — so the package has to BE a loader entry for its
          # browser half to be composed into `window.__DSH_BOOT__` at all. A row that
          # contributes nothing is still the mechanism that publishes a client bundle.
          #
          # The browser half registers `tool.call.toolview` for board_snapshot,
          # egress_status and vdb_search, so those calls render as cards instead of JSON.
          # It needs no host service and no RPC: the tool result already travels to the
          # browser in the conversation, so the view reads the same bytes the model was
          # given and cannot disagree with them.
          - id: war-board-ui
            name: nissi-war-board-ui

          # ── 作战地图（派工层 + 战争模式视野）────────────────────────────────────────────
          #
          # ★ 这一行是「战争模式不知道自己该打哪」的正面修复。
          #
          # 缺口是什么：作战地图一直在算「主攻方向 / 派工清单」，但战争模式**看不见它**。
          # 战争模式唯一读到的态势入口是 board_snapshot，而它只吐三个字段的活：
          #   open_objectives（status==='open'）、expired_claims、untested_assets。
          # 地图建议的条目如果不变成这些字段里的东西，战争模式就永远看不到 —— 缺口是静默的，
          # 因为地图下一轮会把同一条建议再排一次，看起来像「持续推进」，实际一次都没落地。
          #
          # 这一行给战争模式两件东西：
          #   · opsmap_refresh 工具 —— 任何分队/统帅都能一句话拉出当前局势与派工清单，
          #     不必等指挥员转述。返回的是摘要（不是 370KB payload），模型只读能与不能。
          #   · 派工层里每条建议的**可直接执行的 board 调用参数**：可直接建卡的直接给
          #     {tool, args}；该单位一张资产卡都没有的（register-gap / open-front）给两步，
          #     必须先 board_asset_add 建卡再挂意图卡 —— 这正是以前 intent 落不了地的原因。
          #
          # 只读边界不变：地图读板面、绝不写板面。它产出调用参数，由你做这个动作。
          # 理由：写权限一旦开给地图，exec.agent.id 溯源、认领心跳租约、
          # 「不登记就锁死写入」、审批门禁四个不变量全部作废。
          #
          # lib 是 opsmap preset 目录的一份【真实副本】，由
          #   node <HOME>/.dsh/.agent-presets/opsmap/build/sync-to-hive.mjs
          # 同步，每次都打 SHA256 核对，不一致就非零退出。
          # ⚠ 这里一开始用的是【目录符号链接】（想省事，让引擎只有一份源码），
          #   结果 Cordis 挂载报 `harness is not defined`，而源码里一个 harness 代码引用都没有
          #   （已全盘 grep 确认，两处提到 harness 的都只是注释）。换成真实副本后恢复。
          #   排查代价极高 —— loader 不告诉你它在执行哪份代码 —— 所以别再用软链。
          - id: opsmap-map
            name: nissi-war-opsmap-1793944835662
            config:
              hiveRoot: '<NISSI_ROOT>/war'

              # 心跳：每 10 分钟自动刷新**所有目标**的地图并落盘，不等人调用。
              #
              # 补的是出发点里明说的「如果需要心跳机制……那就进行设计并开发」。
              # 在此之前地图只有「上报」没有「自动刷新」—— mapStale 会告诉你它多久没刷新，
              # 但那句话的另一面是：没人调 opsmap_refresh 的时候，地图就是停的。
              # 于是「指挥官随时能看到战场局势」实际是「有人问的时候才看得到」。
              # 这个定时器让后者变成前者。
              #
              # 三条纪律：
              #   ① 插件默认**关闭**（heartbeatMs: 0），这里显式开启 ——
              #      会自己动起来的定时器该由部署方授权，而不是插件自己拍。
              #   ② 刷**所有目标**而不只默认那个 —— 页签按会话绑定取对应那份，
              #      每个可能有会话绑上去的目标都得有新鲜的那一份。
              #   ③ unref + ctx.effect 清理 —— 不给进程留下幽灵定时器。
              #
              # 它**只读板面、只写观测文件**，与「地图只读不写板面」不冲突。
              # 心跳自己的观测口：<HOME>/.dsh/opsmap.status.heartbeat.json
              heartbeatMs: 600000

          # ── 闭环桥接：地图的命令 → 板面上的活 ────────────────────────────────────────
          #
          # ★ 上一节（opsmap-map）修的是「战争模式能不能看见地图」。这一行修的是**更狠的一环**：
          #   地图算出了命令，命令却**没有变成战争模式能认领的活**。
          #
          # 第 9 轮实测（可复核）：
          #   · 地图 22 条派工 / 16 条 readyToFile / 18 条带现成 board_* 参数 —— 引擎算得出
          #   · 板面 60 张意图卡里，带地图署名格式 ⟦op:N⟧ 的：**0 张**
          #   · 最大的 hive 会话 4.4MB，opsmap_refresh 只出现 **2 次**
          #   · board 插件的 firePatrol() 唤醒 lead 时只读 objectives/findings，**从未提过地图**
          #
          # 所以不是「循环断了」，是**循环从来没接上**：战争模式在板面上自转，地图在旁边空转。
          #
          # 为什么不把地图对账塞进 board 插件：那会让**事实层依赖决策层**
          # （用户硬规矩：引擎里不许内嵌靶标知识）。所以桥接做成 board 与 opsmap 的**兄弟**：
          # 同时读两边，两边都不知道它存在。依赖方向 bridge → {board, opsmap}，board ⊥ opsmap。
          #
          # 它不注册任何服务（只读目录里的 JSON + 注册一个 map_orders 工具），
          # 与 board 同构，所以不需要 isolate realm，多会话挂载也不会冲突。
          #
          # 它只做**机械对账**，不做判断：
          #   读地图 readyToFile 的命令（每条带 ⟦op:N⟧ 编号，由地图引擎写进卡片标题）
          #   读板面 objectives 的 title/method
          #   算出「已下令但板面上没有活」的命令，用与 firePatrol 同一条通道唤醒 lead
          # lead 收到的是**已经算好的参数**，照抄即可 —— 参谋部出参数，指挥员落地。
          #
          # ★ 防唤醒死循环（本插件最大的风险）：唤醒→写卡→板面变化→再唤醒 会自激。
          #   三道闸：变化门（落差签名变了才唤醒）+ 最小间隔 180s + 单会话上限 12 次。
          #   另外 lead 没在本板面开口过就不唤醒（与 board 的 engaged 门控同一条纪律）。
          # ✋ 桥接不替代判断：地图出的是**建议**，不是授权。lead 若认为某条不该落地，
          #   记进意图卡的 record 说明原因即可，**不要为了消掉落差而建一张空卡**。
          - id: war-bridge
            name: nissi-war-bridge27
            config:
              hiveRoot: '<NISSI_ROOT>/war'
              doctrineRoot: '<NISSI_ROOT>/war/doctrine'

          # ── 三个旁挂插件：只对主帅生效（origin !== subagent）──────────────────────────
          #
          # 重要更正（2026-11-12）：这些插件原本装在 war-lead 里，而 war-lead 是从**部署自带的
          # `cordis`** 复制的 —— 那份组合里根本没有 board2 / opsmap / bridge27，所以那个会话
          # 连 board_snapshot 都不存在，做不了任何板面工作（主帅自己上报的）。
          # 真正带战争工具链的预设是本文件（`war`，显示名「战争模式」，board2 + opsmap + bridge27）。
          #
          # 但 `war` 同时被派出的分队使用，所以三个插件内部都加了判据：
          #   String(agent?.session?.header?.origin ?? '') === 'subagent' ⇒ 直接放行，不记账。
          # 实测噪音依据：9 个 worker 各自写过自己的 turn-1 step-1 记录。
          #
          # ① 通知代理 / 回合收口
          #    merge/drop 两档已被实测否决（803 离线批次 + 34 live 批次，可合并 0 个），
          #    保留其观测价值；真正生效的是 wrapup —— 到第 12 步注入收尾指令。
          #    实测：注入后回合在第 12 步收口（对照无注入时跑 31 步）。
          - id: war-notice-broker
            name: nissi-war-notice-broker
            config:
              root: '<NISSI_ROOT>/war'
              enable: false
              merge: true
              drop: false
              stepBudget: 60
              # ARTEX 对齐（MaxDuration，默认 1200s）：每次运行同时受墙钟约束。只有步数预算拦不住
              # "卡在等"的回合——基线里步数中位才 3 步，最长回合却跑了 881.7 分钟。
              # ⚠ 2026-11-15：12 步 → 60 步（墙钟 20 → 60 分钟）。
              # 依据：12 步对硬题（多目标 / 需先读修复提交）刚好只够「查板面 + 立意图图」，
              # 连续两轮 0 支分队、0 个 PoC —— 预算太小会让主帅不敢派兵、只敢排版。
              timeBudgetMs: 3600000
              wrapup: true
              # ARTEX 对齐（plannerLoop 的 debounce + 回合前守卫，B1/B3）：巡检/对账这类
              # "状态变了、去看一眼"的信号，若在 coalesceMs 内已经跑过一轮，就不再单独开一个回合，
              # 而是攒着搭下一轮的车。子代理回报与人的消息永远有自己的一轮。
              # coalesceMs: 0 = 关掉这道闸（总开回合）。
              coalesceMs: 20000
              # 没有心跳兜底（DSH 目前没有安全的唤醒 API，见 ARTEX-LESSONS.md B2），
              # 所以纯粹按年龄放行：压超过 maxDeferMs 的通知即使是单独一条也必须放这轮进来。
              maxDeferMs: 180000

          # ② 工具输出冷凝（LIVE）
          #    实测：一场会话 6 条命中、154 KB 原始 → 若留在上下文是 3.43 MB 复利，
          #    冷凝后仅 0.27 MB，省 92%；单条最大 project_map 720 KB。
          #    落盘放 hive 之外，避免把之前清理掉的扫描代价重新种回来。
          - id: war-tool-condenser
            name: nissi-war-tool-condenser
            config:
              root: '<NISSI_ROOT>/war'
              enabled: true
              condenseBytes: 8192
              previewChars: 2048
              spillDir: '<NISSI_ROOT>/war/_spill'

          # ③ 子代理并发闸门（LIVE，2026-11-12 转正）
          #    实测：主帅一次派 9 个分队 → 19 分钟 RSS 260 MB → 2,932 MB。
          #    参照 ARTEX 每任务 worker=3。计数只看 status==='running'：跑完的子代理仍留在注册表里
          #    （可以 send_message 续跑），若按"注册过"计数，主帅派满 3 个就被永久锁死——那不是限流，是死锁。
          #    已知边界：同一 step 内并行发出的多个派工可能都读到旧计数，闸门主要拦跨步的连续增派。
          #    超限即 deny（tools/pre-execute）；日志 fanout.jsonl 的 kind：startup/allowed/would-deny/denied。
          - id: war-fanout-gate
            name: nissi-war-fanout-gate
            config:
              root: '<NISSI_ROOT>/war'
              enabled: true
              maxChildren: 3

          # ④ 战役内核（意图图）
          #
          # 这一行是把「记忆」从会话里搬出去的地方。对应 ARTEX 的探索图 + 意图生命周期：
          #   主帅派意图（intent_add）→ 分队领一条（intent_claim）→ 写回事实/战果（intent_finish）
          #   → 依赖满足后解锁下游（needs）→ 打空的记 exhausted（不是失败，可重开）
          #
          # 图在 <WAR_ROOT>/_graph/nodes.jsonl + edges.jsonl（追加式，崩了重放）。主帅可以丢历史，图还在。
          # 角色隔离是**代码拒绝**：分队调 intent_add / intent_reopen 直接 REFUSED。
          #
          # `wake: false` 是刻意的第一步：心跳会主动唤醒空闲主帅，必须等主帅的 planner 人格就位
          # 再开，否则它会一次次被叫醒却不知道自己该只派活、不亲自动手。先只上工具，验通了再开心跳。
          - id: war-opsgraph
            name: nissi-war-opsgraph
            config:
              root: '<NISSI_ROOT>/war'
              # 2026-11-12 转正：dispatch → claim → finish 全链路已活体验证（nodes.jsonl 六行完整证据）。
              wake: true
              heartbeatMs: 45000
              minWakeGapMs: 90000
              maxWakes: 40
              # 预算上限（无人值守第三道刹车）：到点拒绝派新意图，并在拒绝里指路去收口。
              maxIntents: 200
              # ⚠ 2026-11-15：6h → 48h。实测该值按「旧战役起点」累计、战役收口后不归零，
              # 于是关掉战役立刻接新战役会被直接拒绝（war/intel/intel-t1k58t 记录了该现象）。
              # 这是止血，不是根治——根治要看该插件能否按战役重置，已记为待办。
              maxWallMs: 172800000

          # ⑤ 自毁闸门（无人值守的刹车）
          #
          # 与 roe-gate 分工：roe-gate 管「别把靶标业务打死」，本行管「别把自己打死」。
          # 一个对外，一个对内，撞不了车。
          #
          # 为什么要它：授权边界管的是**目标范围**，管不到**动作强度**。`rm -rf /`、`format c:`、
          # `DROP DATABASE`、`shutdown`、`iptables -F`、删 `.war` 账本——这些打在授权目标上同样毁灭。
          # 无人值守等于没人踩刹车，所以这一行不是可选项。
          #
          # ★ 边界诚实：黑名单天然失败开放。它是"把已知自毁动作挡在门外并留痕"，不是安全保证。
          #   每次拦截写 `<WAR_ROOT>/_stops/stops.jsonl`；闸门自身出错则留痕并放行
          #   （一个坏掉的闸门把整支队伍堵死，比漏掉一次拦截更糟）。
          - id: war-stops
            name: nissi-war-stops
            config:
              root: '<NISSI_ROOT>/war'
              enabled: true

          # ── goals ───────────────────────────────────────────────────────────────────

          # Only the model-facing tool. The goal SERVICE, its session driver, and the
          # `/goal` command stay on the host plane: the Gateway serves the goal domain as
          # Remote endpoints whose receiver comes from a generated descriptor, so it
          # resolves `goals` on the host and an entry-local realm here would hide it. The
          # registry is keyed by session anyway, so one host instance serves every
          # session. What a preset chooses is whether its agent can call the goal tool.
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
          # share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
          # plane, and the rows here resolve that one instance. It takes no configuration,
          # keys every fold by Session, and owns the context-meter projection units the
          # browser reads for every session — behind a realm those units would come and go
          # with whichever presets happen to be mounted. What a preset chooses is whether
          # its agent compacts at all, which is `compaction-basic` below.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session queries
          # the api-proxy serves to the browser, and a provider name may only be
          # registered once. This preset contributes the delegation TOOLS, which resolve
          # that host registry.
          #
          # `workflows` is different — nothing outside an agent reads it — so every row
          # that reaches it shares one entry-local realm here, and a consumer left
          # outside would resolve a host registry this preset does not populate.
          #
          # `tool-subagent-report` is host-plane for the same reason as the registry,
          # not because a preset may not want it: it registers a CONTINUABLE SETUP on
          # that singleton rather than a tool this agent calls, and the setup list is
          # not scope-aware — one copy per mounted preset means every child gets
          # `report` registered once per live session, which throws on the second.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # Production dsh does not install these optional providers. Install the
              # matching Bundle in this Profile and restart the Host, then copy this
              # preset and remove `disabled` from the matching tool row. Host availability
              # alone grants no tool.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: workflow-worker-thread
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000


# ── 让 nissi 成为默认与新建会话的预设 ──────────────────────────────────────
# ⚠ 这三行是整个移植里最关键的一处接线：只 insert preset-nissi 是不够的，
#   注册表的 default 不指过来，新会话仍然用出厂 standard，人格根本不是战争模式。
#   （第一版就漏了这条，症状是"进程起来了、会话也开了，但完全没有统帅人格"。）
- id: agent-preset-registry
  config:
    default: nissi
    selectedDefault: nissi
# <<< NISSI_WAR_END

# >>> NISSI_PROJECTMAP_BEGIN（scripts/project-map-wire.mjs 生成）
#
# 项目地图：多会话并行开发的使命登记与冲突检测、结构体检、git 变更雷达、依赖影响分析。
# 方案 B —— 管 Nissi 自己（projectRoot=<NISSI>, project=nissi）。
# 数据根与配置在 <NISSI_ROOT>/project-map/（不与 ~/.dsh/project-map-kit 共用）。
# 回退：删掉本区块并重启。

- insert:
    - id: nissi-project-map
      name: 'nissi-project-map'
      config:
        projectRoot: '<NISSI>'
        project: 'nissi'
        missionsDir: '<NISSI_ROOT>/project-map/missions'
        reportsDir: '<NISSI_ROOT>/project-map/reports'
        rulesFile: 'docs/paradigm.md'
        featureMapFile: '<NISSI_ROOT>/project-map/feature-map.json'
        gitEnabled: true
        json: '<NISSI_ROOT>/project-map/project-map.config.json'
# <<< NISSI_PROJECTMAP_END

# >>> NISSI_BOARD_BEGIN（nissi-board 宿主行，勿手改）
#
# 把 <NISSI_ROOT>/war 的板面（资产/任务/战果/战役/证据/情报）与战法库变成
# 只读 HTTP 接口，供左栏与页面读取：
#   GET /api/nissi-board/summary  各类条数 + 最后写入时间 + 战法库分类统计
#   GET /api/nissi-board/cards    168 张战法卡的标题与路径
#   GET /api/nissi-board/card?path=…  单卡正文
#
# 为什么用 fetch.register 而不是 rpc.handle：前者是纯 HTTP 精确路由（强校验必须挂在
# /api 下），handler 是标准 Fetch 形状；后者走另一套 bridge，X光机那条通道就是那么
# 撞上 405 的。这一行刻意只走确定能通的那条路。
#
# 回退：删掉本区块并重启。
- insert:
    - id: nissi-board
      name: 'nissi-board'
# <<< NISSI_BOARD_END
